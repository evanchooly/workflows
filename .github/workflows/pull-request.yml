name: Pull Requests

on:
  workflow_call:
    inputs:
      java:
        required: false
        type: string
        default: 11
      maven-flags:
        required: false
        type: string
        default: ""
    secrets:
      AUTOMERGE_TOKEN:
        description: >-
          Token used to enable auto-merge. Merges done with GITHUB_TOKEN don't trigger push workflows, so pass a PAT or
          app token here if the merge should build (and release) the target branch. Dependabot runs only see
          Dependabot secrets, so it must be defined there. Falls back to GITHUB_TOKEN.
        required: false

jobs:
  Build:
    uses: evanchooly/workflows/.github/workflows/build.yml@master
    # runs the PR's code, so keep it read-only even when the caller grants write for the auto-merge job
    permissions:
      contents: read
    with:
      java: ${{ inputs.java }}
      os: ubuntu-latest
      maven-flags: ${{ inputs.maven-flags }}
  dependabot:
    if: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request' }}
    name: Automerge dependabot PRs
    needs:
      - Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: "dependabot-automerge-${{ github.base_ref }}"
      cancel-in-progress: false
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
